# Mise en ligne gratuite sur Render (render.com > New > Blueprint > ce dépôt)
services:
  - type: web
    name: panier-carrefour
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_MOT_DE_PASSE
        sync: false
      # Base gratuite Neon (neon.tech) : garde catalogues et bons pendant la veille, partagés PC et téléphone
      - key: DATABASE_URL
        sync: false
